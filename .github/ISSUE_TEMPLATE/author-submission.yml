name: 作者入驻 / Author profile
description: 申请把某位创作者收录到社区作者页 / Add a creator to the authors page
title: "[Author] "
labels: ["author-submission"]
body:
  - type: markdown
    attributes:
      value: |
        填好下面几项、提交后会自动生成一个 Pull Request,维护者审核合并后作者页就会
        出现这位创作者。头像底色会自动分配,提交作品请另用「作品投稿」。
        **修改已有资料**:用**同一个 @handle** 重新提交本表单即可覆盖旧信息——注意这是**整条替换**,可选项(头像文字 / 头像图片 / 外链)**留空会被清掉**,想保留就一并重填。
        Submitting opens a PR; a maintainer merges it to add the author.
        **Editing an existing profile:** resubmit this form with the **same @handle** to overwrite it. It fully replaces the old entry — optional fields left blank are cleared.
  - type: input
    id: name_zh
    attributes:
      label: 名字(中文)
      placeholder: 银翼
    validations:
      required: true
  - type: input
    id: name_en
    attributes:
      label: Name (English)
      placeholder: SilverWing
    validations:
      required: true
  - type: input
    id: handle
    attributes:
      label: Handle(@用户名)
      placeholder: "@silverwing"
    validations:
      required: true
  - type: input
    id: initials
    attributes:
      label: 头像文字 / Avatar initials(可选,1 个字)
      description: 留空则自动取名字第一个字;仅在不上传头像图时使用 / used only when no avatar image is uploaded
      placeholder: 银
    validations:
      required: false
  - type: textarea
    id: avatar
    attributes:
      label: 头像图片 / Avatar image(可选)
      description: 可选。把头像图片拖进来上传;留空则用上面的字母头像。/ Optional — drag an image here; leave empty to use the generated monogram.
      placeholder: 拖入图片… / drop image here…
    validations:
      required: false
  - type: input
    id: skills_zh
    attributes:
      label: 擅长领域(中文,逗号分隔)
      placeholder: 赛道建模, 激光扫描, 光照烘焙
    validations:
      required: true
  - type: input
    id: skills_en
    attributes:
      label: Skills (English, comma-separated)
      placeholder: Track modeling, Laser scan, Lighting bake
    validations:
      required: true
  - type: textarea
    id: bio_zh
    attributes:
      label: 简介(中文)
      placeholder: 专注高精度赛道复刻……
    validations:
      required: true
  - type: textarea
    id: bio_en
    attributes:
      label: Bio (English)
      placeholder: Focused on high-fidelity track recreations…
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### 外链 / Links
        下面按平台分好了,**有哪个就把链接填到对应的框里**(都可选、留空即不显示)——
        无需自己写平台名,平台图标会自动匹配。别的平台用最后的「其他链接」。
        Fill the box for each platform you have — all optional; the icon is picked automatically.
  - type: input
    id: link_bilibili
    attributes:
      label: Bilibili
      placeholder: https://space.bilibili.com/xxxxxx
    validations:
      required: false
  - type: input
    id: link_afdian
    attributes:
      label: 爱发电 Afdian
      placeholder: https://afdian.com/a/xxxx
    validations:
      required: false
  - type: input
    id: link_weibo
    attributes:
      label: 微博 Weibo
      placeholder: https://weibo.com/u/xxxx
    validations:
      required: false
  - type: input
    id: link_qq
    attributes:
      label: QQ 群 QQ Group
      placeholder: 群号或加群链接 / group number or invite link
    validations:
      required: false
  - type: input
    id: link_youtube
    attributes:
      label: YouTube
      placeholder: https://youtube.com/@xxxx
    validations:
      required: false
  - type: input
    id: link_patreon
    attributes:
      label: Patreon
      placeholder: https://patreon.com/xxxx
    validations:
      required: false
  - type: input
    id: link_x
    attributes:
      label: X (Twitter)
      placeholder: https://x.com/xxxx
    validations:
      required: false
  - type: input
    id: link_discord
    attributes:
      label: Discord
      placeholder: https://discord.gg/xxxx
    validations:
      required: false
  - type: input
    id: link_github
    attributes:
      label: GitHub
      placeholder: https://github.com/xxxx
    validations:
      required: false
  - type: input
    id: link_website
    attributes:
      label: 个人主页 Website
      placeholder: https://your-site.com
    validations:
      required: false
  - type: textarea
    id: link_other
    attributes:
      label: 其他链接 / Other links(可选)
      description: 上面没有的平台放这里,每行一个:名称 | 链接 / one per line — Name | URL
      placeholder: |
        Steam | https://steamcommunity.com/id/xxxx
    validations:
      required: false
