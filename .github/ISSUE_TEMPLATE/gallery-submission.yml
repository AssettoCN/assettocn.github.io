name: 截图投稿 / Gallery submission
description: 投稿一张 Assetto Corsa 游戏截图到社区画廊 / Submit a screenshot to the community gallery
title: "[Gallery] "
labels: ["gallery-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿!填好下面几项、提交后会自动生成一个 Pull Request,维护者审核合并后
        截图就会出现在画廊里。
        Thanks! Fill this in — submitting opens a pull request automatically; once a
        maintainer merges it, your shot shows up in the gallery.
  - type: input
    id: title_zh
    attributes:
      label: 标题(中文) / Title (中文)
      placeholder: 晨雾北环
    validations:
      required: true
  - type: input
    id: title_en
    attributes:
      label: Title (English)
      placeholder: Misty Nordschleife
    validations:
      required: true
  - type: input
    id: by
    attributes:
      label: 投稿者 / Your handle
      description: 会显示在截图下方 / shown under the shot, e.g. @yourname
      placeholder: "@yourname"
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / Screenshot
      description: 把图片直接拖进这个输入框上传(GitHub 会自动生成链接),仅支持 PNG / JPG / WebP;画面比例按图片自动识别。/ Drag & drop the image here to upload (PNG, JPG or WebP); the aspect ratio is detected automatically.
      placeholder: 拖入图片… / drop image here…
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        下面三项都是可选的拍摄信息,写原名即可(不用翻译),会显示在截图下方,也能在画廊里搜到。
        The fields below are optional shot details — use the original names. They're shown under the shot and are searchable.
  - type: input
    id: car
    attributes:
      label: 车型 / Car
      placeholder: Porsche 911 GT3 RS
  - type: input
    id: track
    attributes:
      label: 赛道 / Track
      placeholder: Nordschleife
  - type: input
    id: ppfilter
    attributes:
      label: 滤镜 / PP filter
      description: 比如 C13、Newgen;没用滤镜可以留空 / e.g. C13, Newgen; leave empty if none
      placeholder: C13
