name: 服务器收录 / Server listing
description: 申请把你的 Assetto Corsa 服务器收录到社区列表 / Apply to list your server
title: "[Server] "
labels: ["server-submission"]
body:
  - type: markdown
    attributes:
      value: |
        填好下面几项、提交后会自动生成一个 Pull Request,维护者审核合并后服务器
        就会出现在列表里(收录时默认标记为在线、当前人数 0)。
        Submitting opens a PR automatically; a maintainer merges it to list your server.
  - type: input
    id: name_zh
    attributes:
      label: 服务器名称(中文)
      placeholder: ACN 公共巡航服
    validations:
      required: true
  - type: input
    id: name_en
    attributes:
      label: Server name (English)
      placeholder: ACN Public Cruise
    validations:
      required: true
  - type: input
    id: region_zh
    attributes:
      label: 区域(中文)
      placeholder: 华东 · 上海
    validations:
      required: true
  - type: input
    id: region_en
    attributes:
      label: Region (English)
      placeholder: East · Shanghai
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 类型 / Category
      description: 服务器主要玩法 / Primary discipline
      options:
        - 围场 Circuit
        - 漂移 Drift
        - 山路 Touge
        - 漫游 Cruise
    validations:
      required: true
  - type: input
    id: mode_zh
    attributes:
      label: 模式(中文)
      placeholder: 自由巡航
    validations:
      required: true
  - type: input
    id: mode_en
    attributes:
      label: Mode (English)
      placeholder: Free roam
    validations:
      required: true
  - type: input
    id: max
    attributes:
      label: 最大人数 / Max players
      placeholder: "30"
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: 接入地址 ip:port / Server address
      description: 实际连接地址,例如 120.26.18.63:8410;会显示接入信息并生成 CM 一键加入 / actual connect address
      placeholder: "120.26.18.63:8410"
    validations:
      required: false
  - type: input
    id: homepage
    attributes:
      label: 主页 / 介绍页(可选) / Homepage (optional)
      description: 服务器介绍页,非接入地址;卡片「主页」按钮指向它 / info page, not the connect address
      placeholder: "https://srp.udstu.com"
    validations:
      required: false
