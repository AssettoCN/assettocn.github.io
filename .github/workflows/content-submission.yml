name: Content submission → PR

# Turns a submission issue (gallery / server / author / work) into the matching
# src/content/**/<id>.yaml (+ any downloaded image) and opens a PR. Merging the
# PR is the moderation step; the site rebuilds from the new content.
on:
  issues:
    # 只监听 opened / edited。不要加 labeled:表单建 issue 会同时触发 opened
    # 和 labeled,会让本工作流跑两遍、重复开 PR。要重新触发就编辑一下 issue。
    types: [opened, edited]

permissions:
  contents: write
  issues: write        # 给原 issue 发状态评论(github-script)需要
  pull-requests: write

# 每个 issue 同一时间只保留一个转换 run:提交者连续编辑、或多事件叠加时,
# 取消进行中的旧 run,避免重复开 PR / 重复评论。
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-entry:
    # 只处理开着的 issue。PR 合并后 issue 自动关闭,之后再编辑它不该重新生成内容:
    # 作品的 updated 按当月生成,跨月编辑就会开出一个新 PR,盖掉维护者后来的修改。
    if: >
      github.event.issue.state == 'open' && (
      contains(github.event.issue.labels.*.name, 'gallery-submission') ||
      contains(github.event.issue.labels.*.name, 'server-submission') ||
      contains(github.event.issue.labels.*.name, 'author-submission') ||
      contains(github.event.issue.labels.*.name, 'work-submission'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve submission kind from label
        id: kind
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          case "$LABELS" in
            *gallery-submission*) echo "kind=gallery" >> "$GITHUB_OUTPUT" ;;
            *server-submission*)  echo "kind=server"  >> "$GITHUB_OUTPUT" ;;
            *author-submission*)  echo "kind=author"  >> "$GITHUB_OUTPUT" ;;
            *work-submission*)    echo "kind=work"    >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Convert issue → content entry
        id: convert
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # 用于核对「更新已有作者 / 作品挂在谁名下」的账号归属,见脚本里的 owners
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          # 给下面「Write PR description」用的摘要;放在 runner.temp,不能进工作区(否则会被提交进 PR)
          REVIEW_FILE: ${{ runner.temp }}/submission-review.json
        run: node .github/scripts/issue-to-content.mjs

      # 上一步是原样下载投稿图(转换脚本刻意零依赖),这里统一规范尺寸和体积。
      # 没有这一步,投稿者拖进表单的原图会原封不动进仓库——曾经有过一张 1080px /
      # 833KB 的头像,而它只渲染到 104px。脚本是幂等的,已达标的图不会被重编码。
      # continue-on-error:优化失败不该拦住投稿,PR 照开,大不了人工再压一次。
      - name: Optimise downloaded images
        if: steps.convert.outputs.status == 'ok'
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          node scripts/optimize-images.mjs

      # PR 描述:字段表、图片预览、自动检查出的问题(标签没拆开、纯文本外链、图片超预算、待核实)。
      # 放在压图之后,报告的图片体积才是最终提交的大小。
      - name: Write PR description
        if: steps.convert.outputs.status == 'ok'
        env:
          REVIEW_FILE: ${{ runner.temp }}/submission-review.json
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: node .github/scripts/pr-body.mjs

      # 仓库只开 squash / rebase 合并,单提交的 PR squash 后标题就是这里的 commit-message,
      # 所以它就是 main 上留下的那条历史:写清 add / update,并带 closes 关闭原 issue。
      - name: Open pull request
        id: cpr
        if: steps.convert.outputs.status == 'ok'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: submission/${{ steps.convert.outputs.kind }}-issue-${{ github.event.issue.number }}
          commit-message: "${{ steps.convert.outputs.kind }}: ${{ steps.convert.outputs.action }} ${{ steps.convert.outputs.id }} (closes #${{ github.event.issue.number }})"
          title: "${{ steps.convert.outputs.kind }}: ${{ steps.convert.outputs.title }} (#${{ github.event.issue.number }})"
          # 账号对不上时脚本会多给一个 needs-verification(见 notice)
          labels: ${{ steps.convert.outputs.labels }}
          body-path: ${{ runner.temp }}/pr-body.md

      # 状态评论。报错信息里会带上投稿者填的原文,必须经环境变量传进脚本:若用 ${{ }} 直接拼进 JS
      # 模板字符串,原文里的反引号或 ${ 就能跳出字符串执行任意代码(而这个 job 有写权限)。
      # 编辑 issue 会重跑本工作流,以前每次都新发一条一样的「✅ 已生成 PR」(#13 下面有两条)。
      # 现在和上一条状态评论内容相同就不再发;内容变了(报错 → 通过、换了个报错)才发新的 ——
      # 不改旧评论,是因为编辑评论不会通知投稿者,新评论会。
      - name: Comment status on the issue
        if: steps.convert.outputs.status == 'error' || steps.cpr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.convert.outputs.status }}
          MESSAGE: ${{ steps.convert.outputs.message }}
          NOTICE: ${{ steps.convert.outputs.notice }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        with:
          script: |
            const { STATUS, MESSAGE, NOTICE, PR_URL } = process.env;
            const MARK = '<!-- submission-bot:status -->';
            const text = STATUS === 'ok'
              ? `✅ 已根据你的投稿生成 PR:${PR_URL}\n审核合并后就会上线。${NOTICE ? `\n\n${NOTICE}` : ''}`
              : `⚠️ 暂时无法处理这条投稿:\n\n${MESSAGE}\n\n可以编辑本 issue 补全后再试。`;
            const body = `${MARK}\n${text}`;
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const last = comments.filter((c) => c.user?.type === 'Bot' && (c.body || '').startsWith(MARK)).pop();
            const norm = (s) => s.replace(/\r\n/g, '\n').trim();
            if (last && norm(last.body) === norm(body)) {
              core.info('Status unchanged since the last bot comment; not posting again.');
              return;
            }
            await github.rest.issues.createComment({ ...issue, body });

      # 表单默认标题只有「[Work] 」这样的前缀,投稿者多半不改,issue 列表里分不清谁是谁
      # (前 15 条里有 8 条是这样)。标题还是默认值才改成解析出的名称,自己写了标题的不动。
      # 用 GITHUB_TOKEN 改标题不会再触发本工作流(GitHub 不让它产生的事件启动新 run)。
      - name: Name the issue after the submission
        if: steps.convert.outputs.status == 'ok'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TITLE: ${{ github.event.issue.title }}
          NAME: ${{ steps.convert.outputs.name }}
        with:
          script: |
            const { TITLE, NAME } = process.env;
            const prefix = (TITLE.match(/^\s*(\[[A-Za-z]+\])\s*$/) || [])[1];
            if (!prefix || !NAME.trim()) return;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: `${prefix} ${NAME.trim()}`,
            });
