title:
  zh: "帕加尼Zonda F 2005"
  en: "2005 Pagani Zonda F"
desc:
  zh: "帕加尼Zonda F是意大利帕加尼公司推出的限量版超级跑车，于2005年发布，以纪念F1传奇车手胡安·曼努埃尔·方吉奥命名，中文昵称“风之子”。其搭载梅赛德斯-AMG调校的7.3升V12自然吸气发动机，最大功率602马力，峰值扭矩760牛·米，匹配6速手动变速箱，0-100km/h加速仅需3.6秒，极速达345km/h。车身采用碳纤维材料，较前代减重80kg，全球限量25辆，基础售价57.4万欧元，国内售价约2500万元人民币。\n该车型空气动力学设计升级，车头延长10厘米并配备碳纤维尾翼与扩散器，在300km/h时可产生近600公斤下压力。高性能版本搭载碳陶瓷刹车系统及定制轮胎，曾在英国《Top Gear》赛道圈速超越[法拉利Enzo]。选装全碳纤维套件需额外支付约4万欧元，香港地区含税售价达1200万港元。"
  en: "The Zonda F (or Zonda Fangio - named after Formula One driver Juan Manuel Fangio) debuted at the 2005 Geneva Motor Show. It was the most extensive re-engineered variant of the Zonda yet, even though it shared much with its predecessors, it featured an all new 7.3 L Mercedes-AMG M297 V12 engine which through enhanced intake manifolds, exhaust and a revised ECU now had a power output of 602 PS (443 kW; 594 hp) at 6,150 rpm and 760 N⋅m (561 lb⋅ft) at 4,000 rpm. The transmission is largely the same as the C12 S but had stronger internals and differential gears. Zonda F has a top speed of 345 km/h (214 mph).\n\nProduction of the Zonda F was limited to 25 cars. It came equipped with an extra headlight and a new configuration of fog lights in the lower grille, new bodywork (revised front end, new rear spoiler, more aerodynamic vents all around) that improved the car's aerodynamics, and different side mirrors. Further enhancements over the \"S\" centered on optional carbon/ceramic brakes (measuring 380 mm) developed in conjunction with Brembo, OZ alloy wheels, Inconel exhaust system, hydroformed aluminium intake plenum, and a redesigned \"Z preg\" weave in the crash structure to improve rigidity and reduce weight."
