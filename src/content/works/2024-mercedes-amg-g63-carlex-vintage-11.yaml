desc:
  zh: "2024 Mercedes-AMG G63 Carlex Vintage 是由 Carlex Design 基于 AMG G63 打造的复古豪华定制版本。它保留了 G63 标志性的方盒子造型和强劲性能，同时加入大量复古风格的内外饰设计，让整辆车既有经典老车的味道，也保留了现代 G-Class 的豪华感和力量感"
  en: "The 2024 Mercedes-AMG G63 Carlex Vintage is a retro-inspired luxury conversion based on the AMG G63 by Carlex Design. It keeps the iconic boxy shape and powerful character of the G63, while adding classic styling details inside and out. The result combines vintage elegance with the modern luxury and aggressive presence of the G-Class."
